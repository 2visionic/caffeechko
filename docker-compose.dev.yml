version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dochazka-db-dev
    restart: always
    environment:
      POSTGRES_DB: dochazka_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
